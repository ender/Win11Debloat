[image_builder]
win11-image-builder ansible_host=192.0.2.10

[image_builder:vars]
ansible_user=Administrator
# Store the real password with ansible-vault instead of committing it in plain text:
#   ansible-vault encrypt_string --name 'ansible_password' 'YourPassword'
ansible_password=CHANGE_ME
ansible_connection=winrm
ansible_port=5986
ansible_winrm_transport=ntlm
# Self-signed WinRM certs are common on freshly-imaged/audit-mode hosts; swap this for
# proper certificate validation if your pipeline issues real certs.
ansible_winrm_server_cert_validation=ignore
